# A partir de este lab cambiamos de aplicación: en vez de hello-openshift
# (deliberadamente mínima, para aprender la mecánica básica en los Labs 1
# y 2), usamos PodPet, una app un poco más real (Java/Quarkus, sin base de
# datos), con la que vas a trabajar el resto del workshop. Es una imagen
# pre-construida igual que hello-openshift: nadie la compila acá.
#
# Completa los TODO, y luego: oc apply -f manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podpet
  labels:
    app: podpet
    lab: lab03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podpet
  template:
    metadata:
      labels:
        app: podpet
        lab: lab03
    spec:
      containers:
        - name: podpet
          image: ghcr.io/daytwo-demo/podpet:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: PET_NAME
              valueFrom:
                configMapKeyRef:
                  # TODO: nombre del ConfigMap que creaste
                  name: ""
                  # TODO: key dentro de ese ConfigMap
                  key: ""
            - name: SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  # TODO: nombre del Secret que creaste
                  name: ""
                  key: username
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ""
                  key: password
