# Agrega readiness y liveness probes al Deployment podpet del Lab 3.
# PodPet expone endpoints de salud reales de Quarkus:
#   /q/health/ready  siempre UP
#   /q/health/live   UP normalmente, pero DOWN de verdad si la mascota
#                    queda muy descuidada por más de ~10 segundos
#                    seguidos (ver Lab 4, paso 5).
#
# Completa los dos TODO (ambos probes van al puerto real de la
# aplicación), y luego: oc apply -f manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podpet
  labels:
    app: podpet
    lab: lab04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podpet
  template:
    metadata:
      labels:
        app: podpet
        lab: lab04
    spec:
      containers:
        - name: podpet
          image: ghcr.io/daytwo-demo/podpet:v1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: PET_NAME
              valueFrom:
                configMapKeyRef:
                  name: podpet-config
                  key: PET_NAME
            - name: SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: podpet-credentials
                  key: username
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: podpet-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /q/health/ready
              # TODO: ¿en qué puerto escucha realmente este contenedor?
              port: 0
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              # TODO: el mismo puerto que arriba
              port: 0
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
