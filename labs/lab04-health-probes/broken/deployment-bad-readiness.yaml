# Se aplica DESPUÉS de que manifests/deployment.yaml ya funciona, para
# romper el readiness a propósito. La única diferencia con la versión que
# funciona es el puerto del readinessProbe: 8081 en vez de 8080. El
# contenedor sigue escuchando solo en 8080, así que cada intento de probe
# falla con "connection refused", y el Pod se queda Running pero nunca
# llega a Ready.
#
#   oc apply -f broken/deployment-bad-readiness.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podpet
  labels:
    app: podpet
    lab: lab04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podpet
  template:
    metadata:
      labels:
        app: podpet
        lab: lab04
    spec:
      containers:
        - name: podpet
          image: ghcr.io/daytwo-demo/podpet:v1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: PET_NAME
              valueFrom:
                configMapKeyRef:
                  name: podpet-config
                  key: PET_NAME
            - name: SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: podpet-credentials
                  key: username
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: podpet-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
