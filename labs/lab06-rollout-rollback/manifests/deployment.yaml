# Lab 6 - punto de partida, revisión 1. Aplica tal cual:
#   oc apply -f manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-openshift
  labels:
    app: hello-openshift
    lab: lab06
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-openshift
  template:
    metadata:
      labels:
        app: hello-openshift
        lab: lab06
    spec:
      containers:
        - name: hello-openshift
          image: docker.io/openshift/hello-openshift:v3.9.0
          ports:
            - containerPort: 8080
          env:
            - name: RESPONSE
              value: "Application version 1"
