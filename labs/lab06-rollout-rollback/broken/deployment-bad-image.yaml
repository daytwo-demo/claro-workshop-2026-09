# Revisión 3: un rollout deliberadamente roto, aplicado sobre una
# revisión 2 que funciona. Aplícalo una vez que tengas la versión 2
# corriendo:
#   oc apply -f broken/deployment-bad-image.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podpet
  labels:
    app: podpet
    lab: lab06
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podpet
  template:
    metadata:
      labels:
        app: podpet
        lab: lab06
    spec:
      containers:
        - name: podpet
          image: ghcr.io/daytwo-demo/podpet:v9.9.9
          ports:
            - containerPort: 8080
          env:
            - name: PET_NAME
              value: "Application version 3"
