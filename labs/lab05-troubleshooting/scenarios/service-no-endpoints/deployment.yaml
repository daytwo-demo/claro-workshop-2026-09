# Manifiesto de configuración del Escenario 3. Tu instructor lo aplica
# antes de este lab; no necesitas aplicarlo tú mismo. Léelo solo después
# de haber completado tu diagnóstico, para comparar notas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app: catalog
    lab: lab05
    scenario: service-no-endpoints
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        lab: lab05
    spec:
      containers:
        - name: catalog
          image: ghcr.io/daytwo-demo/podpet:v1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: PET_NAME
              value: "catalog"
