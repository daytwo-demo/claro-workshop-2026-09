# Manifiesto de configuración del Escenario 4. Tu instructor lo aplica
# antes de este lab; no necesitas aplicarlo tú mismo. Léelo solo después
# de haber completado tu diagnóstico, para comparar notas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app: notifications
    lab: lab05
    scenario: readiness-failure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
        lab: lab05
    spec:
      containers:
        - name: notifications
          image: ghcr.io/daytwo-demo/podpet:v1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: PET_NAME
              value: "notifications"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
