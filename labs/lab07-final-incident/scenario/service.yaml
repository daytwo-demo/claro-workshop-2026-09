# Configuración del incidente del Lab 7. El selector del Service SÍ
# coincide con las labels de los Pods, pero el mapa de puertos apunta al
# targetPort equivocado (8081) en vez del puerto real del contenedor
# (8080). Los Endpoints van a existir, y aun así el tráfico no llega.
# No leas este archivo hasta después de haber entregado tu reporte de
# incidente.
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  labels:
    app: payments-api
    lab: lab07
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 8080
      targetPort: 8081
